name: gazepoint_sdk
description: Advanced cross-platform eye tracking and gaze detection for Flutter. Supports Android, iOS, Web, Windows, macOS, and Linux with real-time performance.
version: 3.0.0
homepage: https://github.com/Tareq-Ghassan/GazePointSDK-Flutter
repository: https://github.com/Tareq-Ghassan/GazePointSDK-Flutter
issue_tracker: https://github.com/Tareq-Ghassan/GazePointSDK-Flutter/issues
documentation: https://github.com/Tareq-Ghassan/GazePointSDK-Flutter#readme

topics:
  - eye-tracking
  - gaze
  - camera
  - ml-kit
  - vision
  - computer-vision
  - opencv
  - mediapipe

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.38.4"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.gazepoint.flutter
        pluginClass: GazepointSdkPlugin
      ios:
        pluginClass: GazepointSdkPlugin
      web:
        pluginClass: GazepointSdkWeb
        fileName: gazepoint_sdk_web.dart
      windows:
        pluginClass: GazepointSdkPluginWindows
      macos:
        pluginClass: GazepointSdkPlugin
      linux:
        pluginClass: GazepointSdkPlugin
